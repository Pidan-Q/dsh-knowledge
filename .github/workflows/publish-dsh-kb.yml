name: publish-dsh-kb

on:
  # 手动触发：Actions 页点 Run workflow（配好 NPM_TOKEN secret 后）
  workflow_dispatch: {}
  # 推送 v* tag 自动触发（如 v0.1.7）
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # setup-node 会把 NODE_AUTH_TOKEN 写进 runner 的 .npmrc，
          # npm publish 直接读取，token 只存在于 GitHub Secrets，不经对话/沙箱
          registry-url: https://registry.npmjs.org
      - name: Install workspace deps
        run: pnpm install --frozen-lockfile
      - name: Publish dsh-kb
        working-directory: packages/knowledge
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
